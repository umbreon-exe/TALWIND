function blit(pattern,pal,x,y){for(let j=0;j<pattern.length;j++){const row=pattern[j];for(let i=0;i<row.length;i++){const col=pal[row[i]];if(col){ctx.fillStyle=col;ctx.fillRect(Math.round(x+i),Math.round(y+j),1,1)}}}}
const map=Array.from({length:MH},()=>Array(MW).fill('grass'));
function put(tx,ty,type){if(tx>=0&&ty>=0&&tx<MW&&ty<MH)map[ty][tx]=type}
function makeWorld(){
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)put(x,y,((x*17+y*23)%29===0)?'grassB':'grass');
  for(let y=0;y<MH;y++){const rx=43+Math.round(Math.sin(y*.19)*1.7);for(let d=-1;d<=1;d++)put(rx+d,y,'water');put(rx-2,y,'shore');put(rx+2,y,'shore')}
  for(let x=5;x<44;x++)for(let dy=-1;dy<=1;dy++)put(x,24+dy,'path');
  for(let y=8;y<42;y++)for(let dx=-1;dx<=1;dx++)put(22+dx,y,'path');
  for(let x=17;x<29;x++)for(let y=18;y<30;y++)if((x+y)%2===0)put(x,y,'path');
  // meadow, gardens and forest clearings
  for(let x=4;x<40;x++)for(let y=5;y<43;y++)if((x*13+y*7)%47===0)put(x,y,'flower');
  for(let x=7;x<15;x++)for(let y=10;y<17;y++)if((x+y)%3===0)put(x,y,'flower');
}

function drawTile(type,x,y,variation=0){
  if(type==='grass'||type==='grassB')blit(patterns[type],paletteFor[type],x,y);
  else if(type==='path')blit(patterns.pathA,paletteFor.pathA,x,y);
  else if(type==='water')blit(patterns.waterA,paletteFor.waterA,x,y);
  else if(type==='shore'){
    blit(patterns.grassA,{g:C.grass},x,y);
    for(let i=0;i<5;i++){ctx.fillStyle=i%2?C.waterL:C.water;ctx.fillRect(x+11+i,y+((i*3+variation)%13),1,2)}
    ctx.fillStyle=C.foam;ctx.fillRect(x+10,y+3+variation%6,4,1);
  }else if(type==='flower'){
    blit(patterns.grassB,paletteFor.grassB,x,y);
    blit(patterns.flowerA,paletteFor.flowerA,x,y);
  }
}
function drawHouse(h){
  const x=h.x*T,y=h.y*T,roofPal={r:['#b94b40','#c55a45','#a94a42','#c77a46','#4f8791','#b85042','#d18d43','#4e8594','#cf694d','#b85749'][h.roof],x:C.roofD,l:C.roofL};
  // deep cast shadow and the warm plaster walls
  ctx.fillStyle='#3a59444a';ctx.fillRect(x+3,y+39,59,10);
  for(let row=0;row<2;row++)for(let col=0;col<3;col++)blit(patterns[row===0?'wallA':'wallB'],paletteFor[row===0?'wallA':'wallB'],x+8+col*16,y+5+row*16);
  // roof: individual patterned shingle tiles, with a dark fascia and highlights
  for(let row=0;row<2;row++)for(let col=0;col<4;col++)blit(patterns[(row+col)%2?'roofA':'roofB'],roofPal,x+col*16,y-17+row*16);
  ctx.fillStyle=C.outline;ctx.fillRect(x-1,y+12,4,34);ctx.fillRect(x+61,y+12,4,34);
  // windows have wooden frames, a bright pane and a small crossbar
  drawWindow(x+13,y+14);drawWindow(x+43,y+14);
  drawDoor(x+27,y+20);
  // chimney and roof ridge glints
  ctx.fillStyle=C.outline;ctx.fillRect(x+48,y-24,8,12);ctx.fillStyle='#b7b2a0';ctx.fillRect(x+49,y-23,6,7);ctx.fillStyle='#e9d0a0';ctx.fillRect(x+49,y-24,6,2);
}

  ctx.fillStyle=C.woodD;ctx.fillRect(x+4,y+1,1,8);ctx.fillRect(x+1,y+5,7,1);
  ctx.fillStyle='#e6bd79';ctx.fillRect(x-2,y+10,13,2);
}
function drawDoor(x,y){
  ctx.fillStyle=C.outline;ctx.fillRect(x-1,y-1,14,20);ctx.fillStyle=C.wood;ctx.fillRect(x,y,12,19);
  ctx.fillStyle=C.woodL;ctx.fillRect(x+2,y+2,8,14);ctx.fillStyle=C.woodD;ctx.fillRect(x+5,y+2,1,14);
  ctx.fillStyle=C.gold;ctx.fillRect(x+9,y+10,2,2);ctx.fillStyle='#d9a46b';ctx.fillRect(x-2,y+18,16,2);
}

  const x=o.x,y=o.y;
  ctx.fillStyle='#3c553b80';ctx.fillRect(x+4,y+25,25,5);
  blit(patterns.trunk,{d:C.woodD,w:C.wood},x+12,y+17);
  blit(patterns.leafA,paletteFor.leafA,x,y);
  blit(patterns.leafB,paletteFor.leafB,x+14,y+2);
  ctx.fillStyle=C.leafX;ctx.fillRect(x+7,y+5,3,2);ctx.fillRect(x+19,y+8,2,2);ctx.fillRect(x+11,y+14,2,2);
  ctx.fillStyle=C.leafD;ctx.fillRect(x+3,y+19,3,3);ctx.fillRect(x+25,y+15,3,4);
}
function drawActor(a,isPlayer=false){
  const x=Math.round(a.x-8),y=Math.round(a.y-20),bob=isPlayer&&Math.hypot(player.vx,player.vy)>1?Math.round(Math.sin(player.walk)*1):0;
  ctx.fillStyle='#344f3c88';ctx.fillRect(x+3,y+22,11,3);
  if(isPlayer){
    blit(patterns.hero,paletteFor.hero,x,y+bob);
    // face, helmet rim and shoulder detail
    ctx.fillStyle='#684431';ctx.fillRect(x+5,y+9+bob,2,2);ctx.fillRect(x+10,y+9+bob,2,2);
    ctx.fillStyle='#d9b66c';ctx.fillRect(x+4,y+5+bob,8,1);
    if(player.attack>0){ctx.fillStyle='#f6e69a';if(player.dir==='left')ctx.fillRect(x-9,y+9,8,3);else if(player.dir==='right')ctx.fillRect(x+17,y+9,8,3);else if(player.dir==='up')ctx.fillRect(x+6,y-5,3,8);else ctx.fillRect(x+7,y+23,3,8)}
  }else{
    const shirt=a.shirt||C.blue;
    blit(patterns.npc,paletteFor.npc,x,y);
    ctx.fillStyle=shirt;ctx.fillRect(x+4,y+13,8,7);ctx.fillRect(x+3,y+15,2,4);ctx.fillRect(x+11,y+15,2,4);
    ctx.fillStyle='#604332';ctx.fillRect(x+5,y+8,2,2);ctx.fillRect(x+10,y+8,2,2);
    ctx.fillStyle='#fff0c8';ctx.fillRect(x+6,y+8,1,1);ctx.fillRect(x+11,y+8,1,1);
  }
}
function drawSlime(e){
  const x=Math.round(e.x-8),y=Math.round(e.y-10);
  ctx.fillStyle='#36533e88';ctx.fillRect(x+2,y+10,13,3);
  blit(patterns.slime,paletteFor.slime,x,y);
  ctx.fillStyle='#eff6bb';ctx.fillRect(x+4,y+5,2,2);ctx.fillRect(x+10,y+5,2,2);
  ctx.fillStyle='#33553d';ctx.fillRect(x+5,y+6,1,2);ctx.fillRect(x+11,y+6,1,2);
}
function drawWell(x,y){
  ctx.fillStyle=C.outline;ctx.fillRect(x,y+4,28,15);ctx.fillStyle='#a6a18b';ctx.fillRect(x+2,y+5,24,12);
  ctx.fillStyle='#5d9eaa';ctx.fillRect(x+5,y+7,18,8);ctx.fillStyle='#b8e2d2';ctx.fillRect(x+8,y+8,6,2);
  ctx.fillStyle=C.woodD;ctx.fillRect(x+1,y+1,26,3);ctx.fillRect(x+4,y-5,3,8);ctx.fillRect(x+21,y-5,3,8);
  ctx.fillStyle='#bd8a59';ctx.fillRect(x+3,y-7,22,3);ctx.fillStyle=C.gold;ctx.fillRect(x+12,y-2,2,2);
}
function drawStall(x,y){
  ctx.fillStyle=C.outline;ctx.fillRect(x,y+7,30,15);ctx.fillStyle=C.wood;ctx.fillRect(x+2,y+9,26,11);
  ctx.fillStyle='#d8b278';ctx.fillRect(x-1,y+4,32,4);ctx.fillStyle='#c95449';ctx.fillRect(x+1,y-4,28,8);
  ctx.fillStyle='#f0c36b';ctx.fillRect(x+1,y-4,7,8);ctx.fillRect(x+15,y-4,7,8);
  ctx.fillStyle='#5c8c55';ctx.fillRect(x+5,y+6,4,3);ctx.fillStyle='#e2b950';ctx.fillRect(x+14,y+6,5,3);
}
function drawProp(p){
  const x=p.x,y=p.y;
  if(p.type==='well')drawWell(x,y);
  if(p.type==='stall')drawStall(x,y);
  if(p.type==='crate'){ctx.fillStyle=C.outline;ctx.fillRect(x,y,15,14);ctx.fillStyle=C.woodL;ctx.fillRect(x+1,y+1,13,12);ctx.fillStyle=C.woodD;ctx.fillRect(x+3,y+1,2,12);ctx.fillRect(x+9,y+1,2,12);ctx.fillRect(x+1,y+6,13,2)}
  if(p.type==='barrel'){ctx.fillStyle=C.outline;ctx.fillRect(x+2,y,12,17);ctx.fillStyle=C.woodL;ctx.fillRect(x+3,y+1,10,15);ctx.fillStyle=C.woodD;ctx.fillRect(x+3,y+4,10,2);ctx.fillRect(x+3,y+11,10,2);ctx.fillStyle='#d2a36b';ctx.fillRect(x+3,y+1,2,14)}
  if(p.type==='lamp'){ctx.fillStyle=C.woodD;ctx.fillRect(x+7,y,3,27);ctx.fillStyle=C.gold;ctx.fillRect(x+3,y-7,11,9);ctx.fillStyle='#fff1a4';ctx.fillRect(x+6,y-5,5,5);ctx.fillStyle='#e38d43';ctx.fillRect(x+5,y-4,2,3)}
  if(p.type==='fence'){ctx.fillStyle=C.woodD;ctx.fillRect(x,y+3,16,3);ctx.fillRect(x,y+11,16,3);ctx.fillRect(x+2,y,3,16);ctx.fillRect(x+11,y,3,16);ctx.fillStyle=C.woodL;ctx.fillRect(x+3,y+4,12,1)}
  if(p.type==='bush'){blit(patterns.bushA,paletteFor.bushA,x-3,y-3);ctx.fillStyle=C.gold;ctx.fillRect(x+4,y+4,2,2);ctx.fillRect(x+11,y+8,2,2)}
}
function drawBridge(){
  const rx=43*T+Math.round(Math.sin(23*.19)*1.7)*T;
  for(let y=21;y<=26;y++){
    ctx.fillStyle='#674630';ctx.fillRect(rx-8,y*T,52,16);
    ctx.fillStyle='#b77d4e';ctx.fillRect(rx-7,y*T+1,50,3);
    for(let x=0;x<4;x++){ctx.fillStyle=x%2?'#8f5c3c':'#a96e45';ctx.fillRect(rx-6+x*13,y*T+4,12,10);ctx.fillStyle='#d49a61';ctx.fillRect(rx-5+x*13,y*T+5,1,7)}
    ctx.fillStyle='#644530';ctx.fillRect(rx-8,y*T,2,16);ctx.fillRect(rx+42,y*T,2,16);
  }
  ctx.fillStyle='#d1a26b';ctx.fillRect(rx-10,21*T,3,96);ctx.fillRect(rx+43,21*T,3,96);
}
function drawSeed(s,t){
  const x=s.x-5,y=s.y-8,bob=Math.sin(t/220+s.x)*1.5;
  ctx.fillStyle='#3d664988';ctx.fillRect(x+3,y+14,10,2);
  ctx.fillStyle='#d99b32';ctx.fillRect(x+7,y+4+bob,4,9);ctx.fillRect(x+5,y+7+bob,2,4);
  ctx.fillStyle='#fff0a0';ctx.fillRect(x+6,y+2+bob,3,3);ctx.fillRect(x+11,y+5+bob,2,2);
  ctx.fillStyle='#f8d65e';ctx.fillRect(x+8,y+3+bob,2,2);
}
function talk(text,name){
  dialog=true;document.getElementById('speaker').textContent=name;
  document.getElementById('words').textContent=text;document.getElementById('bottom').style.display='block';
}
function closeTalk(){dialog=false;document.getElementById('bottom').style.display='none'}
function interact(){
 if(dialog){closeTalk();return}
 const near=npcs.find(n=>Math.hypot(n.x-player.x,n.y-player.y)<35);
 if(near){
   if(near.kind==='mira'&&found>=3){ruinUnlocked=true;document.getElementById('quest').innerHTML='DIE ALTE RUINE<small>Das Tor im Osten ist offen!</small>';talk('Du hast alle drei Echosamen gefunden! Die Ruine erwacht. Geh über die Brücke nach Osten.','MIRA')}
   else talk(near.line,near.name);
   return;
 }
 const seed=seeds.find(s=>!s.got&&Math.hypot(s.x-player.x,s.y-player.y)<30);
 if(seed){seed.got=true;found++;document.getElementById('seedCount').textContent=found;localStorage.setItem('talwind-seeds',String(found));
   if(found>=3){document.getElementById('quest').innerHTML='ZURÜCK ZU MIRA<small>Die drei Echosamen sind gefunden!</small>';talk('Drei goldene Echosamen! Kehre zum Brunnen zurück und sprich mit Mira.','ECHOSAMEN')}
   else talk('Ein Echosamen! Er leuchtet warm in deiner Hand.','ECHOSAMEN');
   return;
 }
 if(Math.hypot(player.x-68*T,player.y-18*T)<70){
   if(ruinUnlocked)talk('Das uralte Tor schwingt auf. Ein heller Wind trägt eine vergessene Melodie aus den Steinen.','DIE RUINE');
   else talk('Das Tor ist versiegelt. Sammle zuerst die drei Echosamen und sprich mit Mira.','VERSCHLOSSEN');
 }
}
function attack(){
 if(player.attack>0)return;player.attack=.23;
 for(const e of enemies)if(e.alive&&Math.hypot(e.x-player.x,e.y-player.y)<34){e.hp--;if(e.hp<=0)e.alive=false}
}
function inputVector(){
 let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+touch.x;
 let y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+touch.y;
 const pads=navigator.getGamepads?navigator.getGamepads():[];
 const gp=pads&&pads[0];
 if(gp&&gp.connected){
   const ax=gp.axes[0]||0,ay=gp.axes[1]||0;
   if(Math.hypot(ax,ay)>.15){x=ax;y=ay}
   const a=!!(gp.buttons[0]&&gp.buttons[0].pressed),b=!!(gp.buttons[1]&&gp.buttons[1].pressed);
   if(a&&!padAction){interact();padAction=true}if(!a)padAction=false;
   if(b&&!padAttack){attack();padAttack=true}if(!b)padAttack=false;
 }
 const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}
 return{x,y};
}
function blocked(x,y){
 if(x<10||y<8||x>MW*T-10||y>MH*T-8)return true;
 const tx=Math.floor(x/T),ty=Math.floor(y/T),tile=map[ty]&&map[ty][tx];
 if(tile==='water' && !(tx>=41&&tx<=45&&ty>=21&&ty<=26))return true;
 for(const h of houses)if(x>h.x*T+3&&x<h.x*T+61&&y>h.y*T+1&&y<h.y*T+39)return true;
 if(x>67*T&&x<73*T&&y>14*T&&y<23*T&&!ruinUnlocked)return true;
 for(const p of props)if(p.type==='well'&&Math.hypot(x-(p.x+14),y-(p.y+12))<20)return true;
 return false;
}
function update(dt,t){
 const v=inputVector(),speed=94;
 player.vx=v.x*speed;player.vy=v.y*speed;
 if(v.x||v.y){player.walk+=dt*10;player.dir=Math.abs(v.x)>Math.abs(v.y)?(v.x>0?'right':'left'):(v.y>0?'down':'up')}
 let nx=player.x+player.vx*dt,ny=player.y+player.vy*dt;
 if(!blocked(nx,player.y))player.x=nx;if(!blocked(player.x,ny))player.y=ny;
 player.attack=Math.max(0,player.attack-dt);player.inv=Math.max(0,player.inv-dt);
 for(const e of enemies)if(e.alive){
   const dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy);
   if(d<100&&d>3){e.x+=dx/d*22*dt;e.y+=dy/d*22*dt}
   if(d<18&&player.inv<=0){player.hp=Math.max(0,player.hp-1);player.inv=1.0;document.getElementById('hearts').textContent='♥ '.repeat(player.hp)+'♡ '.repeat(5-player.hp);if(player.hp===0){player.hp=5;player.x=22*T+8;player.y=27*T;talk('Du bist zurück zum Dorfbrunnen gebracht worden. Pass im Wald besser auf!','MIRA')}}
 }
 cam.x=Math.max(0,Math.min(MW*T-W,player.x-W/2));cam.y=Math.max(0,Math.min(MH*T-H,player.y-H/2));
}
function render(t){
 ctx.fillStyle=C.grass;ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(-Math.floor(cam.x),-Math.floor(cam.y));
 const sx=Math.floor(cam.x/T),sy=Math.floor(cam.y/T);
 for(let y=sy;y<sy+18;y++)for(let x=sx;x<sx+32;x++)if(map[y]&&map[y][x])drawTile(map[y][x],x*T,y*T,(x+y)%7);
 drawBridge();
 // houses and tall objects are sorted by their ground contact point
 const drawables=[
   ...houses.map(h=>({y:(h.y+2.8)*T,draw:()=>drawHouse(h)})),
   ...trees.map(o=>({y:o.y+29,draw:()=>drawTree(o)})),
   ...props.map(o=>({y:o.y+15,draw:()=>drawProp(o)})),
   ...npcs.map(o=>({y:o.y+5,draw:()=>drawActor(o)})),
   ...enemies.filter(e=>e.alive).map(o=>({y:o.y+5,draw:()=>drawSlime(o)})),
   {y:player.y+4,draw:()=>drawActor(player,true)}
 ].sort((a,b)=>a.y-b.y);
 for(const obj of drawables)obj.draw();
 for(const s of seeds)if(!s.got)drawSeed(s,t);
 // far eastern ruin with stone gate
 const rx=68*T,ry=13*T;
 ctx.fillStyle=C.stoneD;ctx.fillRect(rx,ry,6*T,8*T);ctx.fillStyle=C.stone;ctx.fillRect(rx+5,ry+4,4*T,4*T);
 ctx.fillStyle=C.stoneL;ctx.fillRect(rx+5,ry+4,4*T,2);ctx.fillRect(rx+5,ry+4,2,4*T);
 ctx.fillStyle=ruinUnlocked?'#6eae77':'#493a32';ctx.fillRect(rx+T,ry+2*T,4*T,5*T);
 ctx.fillStyle='#b1a58b';ctx.fillRect(rx+T,ry+2*T,4*T,2);
 ctx.restore();
}
function loop(t){
 if(!started)return;
 const dt=Math.min(.04,(t-last)/1000||0);last=t;
 if(!dialog)update(dt,t);
 render(t);requestAnimationFrame(loop);
}
document.getElementById('begin').onclick=()=>{
 document.getElementById('start').style.display='none';started=true;last=performance.now();requestAnimationFrame(loop);
};
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();keys[k]=true;
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
 if((k==='e'||k===' '||k==='enter')&&!e.repeat)interact();
 if(k==='j'&&!e.repeat)attack();
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
document.querySelectorAll('[data-dir]').forEach(b=>{
 const set=()=>{touch.x=(keys.left? -1:0)+(keys.right?1:0);touch.y=(keys.up?-1:0)+(keys.down?1:0)};
 const press=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[b.dataset.dir]=true;set()};
 const release=()=>{keys[b.dataset.dir]=false;set()};
 b.addEventListener('pointerdown',press);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,release));
});
document.querySelector('[data-act="talk"]').onclick=interact;
document.querySelector('[data-act="hit"]').onclick=attack;
render(0);
})();</script></body></html>
