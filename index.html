    drawPlayer(game,p,t){const c=this.ctx,dir=p.dirX||1,breath=1+Math.sin(t*AN.player.idleBreathHz)*.018,roll=p.rollTime>0,attack=p.attackTime>0;c.save();if(p.deadTime>0)c.globalAlpha=C.clamp(p.deadTime/.9,0,1);const moving=Math.hypot(p.vx,p.vy)>40,bob=moving?Math.sin(t*AN.player.walkBobHz)*2.2:0;c.translate(p.x,p.y+bob);c.fillStyle='rgba(5,13,16,.32)';c.beginPath();c.ellipse(0,21,23,10,0,0,TAU);c.fill();if(roll){c.globalAlpha=.6;c.strokeStyle='#c6ebdf';c.lineWidth=8;c.beginPath();c.ellipse(-dir*20,0,38,18,0,0,TAU);c.stroke();}

    drawDungeon(game,dt){const c=this.ctx,d=K.DUNGEONS.find(x=>x.id===game.dungeonId)||K.DUNGEONS[0],t=game.time;const palette=['#36493e','#5d4939','#34504d','#3d5666','#553c39','#3d3652'];const base=palette[K.DUNGEONS.indexOf(d)];const g=c.createLinearGradient(0,0,1920,1080);g.addColorStop(0,this.shade(base,.1));g.addColorStop(1,this.shade(base,-.18));c.fillStyle=g;c.fillRect(0,0,1920,1080);c.save();c.globalAlpha=.2;c.strokeStyle=d.bossColor;c.lineWidth=2;for(let i=0;i<12;i++){c.beginPath();c.arc(960,540,110+i*52+t%1*12,0,TAU);c.stroke();}c.restore();

    completeDungeon(){const d=this.activeDungeon();if(this.dungeonsCompleted.has(d.id))return;this.dungeonsCompleted.add(d.id);this.storyStep++;this.audio.sfx('victory');this.burst(960,525,'#f8e7b0',55);if(d.reward==='bow')this.inventory.bow=true;if(d.reward==='bomb')this.inventory.bomb=true;if(d.reward==='hook')this.inventory.hook=true;if(d.reward==='wind')this.inventory.wind=true;if(d.reward==='sword3')this.player.swordLevel=3;if(d.reward==='ending'){this.mode='ending';this.audio.setTheme('victory');this.saveGame();return;}
      if(d.id==='root')this.player.swordLevel=Math.max(this.player.swordLevel,2);this.player.hp=Math.min(this.player.maxHp+2,this.player.hp+2);this.player.maxHp=Math.min(10,this.player.maxHp+1);this.player.hp=this.player.maxHp;this.toastText(d.boss+' ist besiegt. Echo geborgen!');this.inDungeon=false;this.dungeonId=null;this.player.x=this.lastOverworld.x;this.player.y=this.lastOverworld.y;this.player.vx=0;this.player.vy=0;this.checkpoint={x:this.player.x,y:this.player.y};this.selectedTool=d.reward==='bow'?'bow':d.reward==='bomb'?'bomb':d.reward==='hook'?'hook':d.reward==='wind'?'wind':'sword';this.audio.setTheme('overworld');this.saveGame();}
    useTool(){const p=this.player,id=this.selectedTool;if(!this.inventory[id]){this.toastText('Dieses Werkzeug fehlt noch.');return;}if(id==='sword'){this.performSwordAttack();return;}if(id==='shield'){p.guardTime=.35;this.audio.sfx('guard');return;}if(id==='lantern'){this.burst(p.x,p.y,'#f3d68f',12);this.audio.sfx('puzzle');if(this.inDungeon&&this.dungeonRoom===1)this.activatePuzzle();return;}
      if(id==='bow'){const speed=680;this.projectiles.push({x:p.x+p.dirX*28,y:p.y+p.dirY*28,vx:p.dirX*speed,vy:p.dirY*speed,life:1.6,damage:3,from:'player',color:'#f2d99a'});this.audio.sfx('attack');if(this.inDungeon&&this.dungeonRoom===1)this.activatePuzzle();return;}
      if(id==='bomb'){this.bombs.push({x:p.x+p.dirX*40,y:p.y+p.dirY*40,timer:1.1});this.audio.sfx('attack');if(this.inDungeon&&this.dungeonRoom===1)this.activatePuzzle();return;}
      if(id==='hook'){const point=this.inDungeon?{x:[640,960,1280][this.puzzleProgress],y:535}:this.nearest;if(point){const dx=point.x-p.x,dy=point.y-p.y,d=Math.hypot(dx,dy);if(d>75&&d<520){p.vx=dx/d*680;p.vy=dy/d*680;this.burst(p.x,p.y,'#b9d9dc',9);}else if(this.inDungeon)this.activatePuzzle();}this.audio.sfx('dodge');return;}
      if(id==='wind'){p.rollTime=.5;p.invuln=.5;p.vx=p.dirX*720;p.vy=p.dirY*720;this.audio.sfx('dodge');if(this.inDungeon&&this.dungeonRoom===1)this.activatePuzzle();return;}
    }
    cycleTool(){const order=K.TOOLS.map(t=>t.id).filter(id=>this.inventory[id]);if(!order.length)return;const i=order.indexOf(this.selectedTool);this.selectedTool=order[(i+1)%order.length];this.toastText(K.TOOLS.find(t=>t.id===this.selectedTool).name);}
    updateEnemy(e,dt){const p=this.player,dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy),def=K.ENEMIES[e.typeIndex]||K.ENEMIES[0];if(d>2450)return;e.timer-=dt;e.cooldown-=dt;e.flash=Math.max(0,e.flash-dt);if(e.state==='hit'){if(e.timer<=0)e.state='idle';e.x+=e.vx*dt;e.y+=e.vy*dt;e.vx*=Math.pow(.04,dt);e.vy*=Math.pow(.04,dt);return;}if(e.state==='stunned'){if(e.timer<=0)e.state='idle';return;}if(e.state==='windup'){if(e.timer<=0){e.state='attack';e.timer=.32;const n=C.normalize(dx,dy);e.vx=n.x*def.speed*2.3;e.vy=n.y*def.speed*2.3;}return;}if(e.state==='attack'){e.x+=e.vx*dt;e.y+=e.vy*dt;e.vx*=Math.pow(.07,dt);e.vy*=Math.pow(.07,dt);if(d<42)this.damagePlayer(def.damage,e);if(e.timer<=0){e.state='rest';e.timer=.75;}return;}if(e.state==='rest'){if(e.timer<=0)e.state='idle';return;}
      const near=d<760;if(!near)return;let vx=0,vy=0;const n=C.normalize(dx,dy),side={x:-n.y,y:n.x};switch(def.ai){case'stalker':vx=n.x;vy=n.y;break;case'guard':vx=n.x*.52;vy=n.y*.52;break;case'orbit':vx=n.x*.45+side.x*.9;vy=n.y*.45+side.y*.9;break;case'charger':if(d<430&&e.cooldown<=0){e.state='windup';e.timer=.72;e.cooldown=2.4;return;}vx=n.x*.35;vy=n.y*.35;break;case'ranged':if(d>420){vx=n.x;vy=n.y;}else if(d<300){vx=-n.x;vy=-n.y;}if(e.cooldown<=0&&d<670){e.cooldown=2.2;this.enemyShot(e,n.x,n.y,def.damage);}break;case'flank':vx=n.x*.55+side.x*.8;vy=n.y*.55+side.y*.8;if(d<250&&e.cooldown<=0){e.state='windup';e.timer=.45;e.cooldown=1.8;}break;case'ambush':if(e.cooldown<=0&&d<350){e.state='windup';e.timer=.58;e.cooldown=2.8;}else{vx=n.x*.25;vy=n.y*.25;}break;case'leap':if(d<390&&e.cooldown<=0){e.state='windup';e.timer=.6;e.cooldown=2.1;}else{vx=n.x*.65;vy=n.y*.65;}break;}
      if(d<52&&e.cooldown<=0){e.state='windup';e.timer=.45;e.cooldown=1.7;}const m=C.normalize(vx,vy);const room=this.inDungeon?null:this.world.getRoomForPosition(e.x,e.y);if(room){const ent={x:e.x,y:e.y};this.world.move(ent,m.x*def.speed*dt,m.y*def.speed*dt,18,false);e.x=ent.x;e.y=ent.y;}else{e.x+=m.x*def.speed*dt;e.y+=m.y*def.speed*dt;}
    }
    enemyShot(e,dx,dy,damage){this.projectiles.push({x:e.x,y:e.y,vx:dx*300,vy:dy*300,life:3,damage,from:'enemy',color:'#e4a98b'});}
    updateProjectiles(dt){for(const b of this.projectiles){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.from==='player'){const enemies=this.inDungeon?this.dungeonEnemies:this.getActiveEnemies();for(const e of enemies)if(e.alive&&Math.hypot(e.x-b.x,e.y-b.y)<26){this.damageEnemy(e,b.damage);b.life=0;break;}if(this.inDungeon&&this.dungeonRoom===3&&Math.hypot(960-b.x,525-b.y)<110){this.damageBoss(b.damage);b.life=0;}}else if(this.inDungeon&&Math.hypot(this.player.x-b.x,this.player.y-b.y)<28){this.damagePlayer(b.damage,{x:b.x,y:b.y});b.life=0;}}
      this.projectiles=this.projectiles.filter(b=>b.life>0);for(const b of this.projectiles){this.spawnParticle(b.x,b.y,b.color,2,.14,0,0,true);}}
    updateBombs(dt){for(const b of this.bombs){b.timer-=dt;if(b.timer<=0){this.burst(b.x,b.y,'#e9b07a',25);this.audio.sfx('hit');const targets=this.inDungeon?this.dungeonEnemies:this.getActiveEnemies();for(const e of targets)if(e.alive&&Math.hypot(e.x-b.x,e.y-b.y)<150)this.damageEnemy(e,7);if(this.inDungeon&&this.dungeonRoom===3&&Math.hypot(960-b.x,525-b.y)<150)this.damageBoss(9);if(this.inDungeon&&this.dungeonRoom===1&&this.selectedTool==='bomb')this.activatePuzzle();}}this.bombs=this.bombs.filter(b=>b.timer>0);}
    updateParticles(dt){for(const p of this.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.38,dt);p.vy*=Math.pow(.38,dt);p.life-=dt;}this.particles=this.particles.filter(p=>p.life>0);if(this.particles.length>750)this.particles.splice(0,this.particles.length-750);if(this.time>this.scheduleNextParticle){this.scheduleNextParticle=this.time+.08;const p=this.player,room=this.currentRoom();if(!this.inDungeon){const b=room.biome;const x=p.x+(Math.random()-.5)*1700,y=p.y-540+Math.random()*1080;let color=b.particle==='snow'?'#e5f3f5':b.particle==='ember'?'#efa16e':b.particle==='dust'?'#e4c38e':b.particle==='mote'?'#add7bf':'#b5d6a4';this.spawnParticle(x,y,color,1+Math.random()*2,3+Math.random()*4,(Math.random()-.5)*9,8+Math.random()*10,b.particle==='ember');}}}
    updateDamageTexts(dt){for(const d of this.damageTexts){d.y-=35*dt;d.life-=dt;}this.damageTexts=this.damageTexts.filter(d=>d.life>0);}
    updateCamera(dt){const p=this.player,lookX=p.vx*.18,lookY=p.vy*.18,targetX=p.x+lookX,targetY=p.y+lookY,s=1-Math.pow(.001,dt);this.camera.x=C.lerp(this.camera.x,targetX,s);this.camera.y=C.lerp(this.camera.y,targetY,s);if(this.shake>0)this.shake=Math.max(0,this.shake-32*dt);}
    shutdown(){this.running=false;if(this.raf)root.cancelAnimationFrame(this.raf);this.input.destroy();this.audio.destroy();}
  }
  function boot(){const canvas=document.getElementById('game');if(!canvas)return;const game=new Game(canvas);root.TALWIND.game=game;root.addEventListener('beforeunload',()=>{try{if(game.mode==='playing')game.saveStore.write(game.slot,game.saveData());}catch(_){}});}
  root.TALWIND=root.TALWIND||{};root.TALWIND.Game={Game,boot};
  if(typeof module!=='undefined'&&module.exports)module.exports={Game};
  if(typeof document!=='undefined'){if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();}
})(typeof window!=='undefined'?window:globalThis);


</script>
