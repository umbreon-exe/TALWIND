<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TALWIND – Die sieben Echos</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#183b32;font:14px Verdana;color:#382d23}#game{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);margin:auto;border:5px solid #69482e;overflow:hidden;background:#6aa958}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.plate,.menu button,.act,.card{background:linear-gradient(#fff4d4,#e9c17e);border:3px solid #67482f;box-shadow:inset 0 0 0 2px #d5a35a,3px 4px #38291f;border-radius:5px;padding:8px 11px;font-weight:bold}.plate small{display:block;font-size:10px;margin-top:3px;color:#795d40}#quest{position:absolute;top:70px;left:50%;transform:translateX(-50%);max-width:60%;text-align:center}.menu{position:absolute;top:110px;left:10px;display:grid;gap:6px}.menu button{cursor:pointer;text-align:left}.actions{position:absolute;right:10px;bottom:10px;display:grid;gap:7px}.act{width:62px;height:58px;cursor:pointer}.act b{display:block;font-size:22px}.act small{font-size:9px}#stick{position:absolute;left:12px;bottom:12px;width:100px;height:100px;border:3px solid #67482f;border-radius:50%;background:#fff2c766;display:none;touch-action:none}#nub{position:absolute;left:29px;top:29px;width:36px;height:36px;border-radius:50%;background:#e6b96e;border:3px solid #67482f}.overlay{position:absolute;inset:0;background:#12382fe8;display:grid;place-items:center;padding:12px}.card{width:min(94%,700px);max-height:95%;overflow:auto;text-align:center;padding:20px}.logo{font:bold clamp(42px,7vw,70px) Georgia;color:#ae483b;text-shadow:3px 4px #64442e;margin:0}.heroes{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0}.hero{background:#f5e2b9;border:3px solid #a27b48;padding:6px 2px;cursor:pointer}.hero.sel{border-color:#ae483b}.hero canvas{width:42px;height:55px;display:block;margin:auto}.hero small{display:block;font-size:9px}.go{background:#b64c3e;color:white;border:3px solid #65442e;padding:12px 20px;font-weight:bold;cursor:pointer}.dialog,.modal{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(75%,620px);background:#fff1cf;border:4px solid #62452e;padding:12px;box-shadow:0 4px #392b20}.dialog{display:none}.dialog strong{color:#a94338}.modal{top:50%;bottom:auto;transform:translate(-50%,-50%);z-index:4}.hide{display:none!important}@media(pointer:coarse){#stick{display:block}}@media(max-width:650px){.plate{font-size:10px;padding:5px}.menu{top:105px;left:5px}.menu button{font-size:10px;padding:6px}.act{width:50px;height:48px}.actions{right:5px;bottom:5px;gap:4px}.heroes{gap:2px}.hero small{display:none}.dialog{width:90%}}
</style></head><body><main id="game"><canvas id="world" width="480" height="270"></canvas><div class="hud"><div class="plate"><span id="hearts">♥ ♥ ♥ ♥ ♥</span><small id="heroName">LYRA · WINDLÄUFERIN</small></div><div class="plate">✦ <span id="seeds">0</span>/3<small><span id="coins">25</span> Windtaler</small></div></div><div id="quest" class="plate">Windruh · Sprich mit Mira</div><nav class="menu"><button data-panel="quest">📜 Questbuch</button><button data-panel="bag">🎒 Rucksack</button><button data-panel="map">🗺 Weltkarte</button><button data-panel="save">💾 Speichern</button></nav><div class="actions"><button class="act" id="skill"><b>✧</b><small>FÄHIGKEIT</small></button><button class="act" id="attack"><b>⚔</b><small>ANGRIFF</small></button><button class="act" id="roll"><b>➤</b><small>ROLLE</small></button><button class="act" id="use"><b>A</b><small>AKTION</small></button></div><div id="stick"><div id="nub"></div></div><div class="dialog" id="dialog"><strong id="speaker"></strong><p id="speech"></p><button id="next">WEITER ▸</button></div><div class="overlay" id="title"><div class="card"><h1 class="logo">TALWIND</h1><h3>DIE SIEBEN ECHOS</h3><p>Erkunde das Tal von Avarra, betrete Häuser, hilf den Bewohnern und entdecke die verlorenen Echos.</p><h3>WÄHLE DEINEN HELDEN</h3><div class="heroes" id="heroes"></div><button class="go" id="start">ABENTEUER BEGINNEN</button><p><small>WASD/Pfeile bewegen · E Aktion · J Angriff · K Fähigkeit · Shift Rolle</small></p></div></div><div class="overlay hide" id="modal"><div class="card"><h2 id="modalTitle"></h2><p id="modalText"></p><button class="go" id="close">SCHLIESSEN</button></div></div></main>
<script>(()=>{const c=document.querySelector('#world'),g=c.getContext('2d'),W=480,H=270;g.imageSmoothingEnabled=false;const hs=[['LYRA','Windläuferin',90,'#3b958c','#d9a45b','Windstoß'],['BRAM','Felswächter',65,'#9b8964','#654a36','Steinhaut'],['KAEL','Waldhüter',76,'#588e4d','#76543b','Sternenschuss'],['NIMA','Echomagierin',72,'#8e70b7','#49354d','Echowelle'],['ROOK','Schattenklinge',86,'#536b83','#423a48','Schattenrolle']];let who=0,started=false,scene='village',quest=0,seeds=0,coins=25,hp=5,dialog=false,paused=false,keys={},stick={x:0,y:0},cam={x:0,y:0},last=0,skillCd=0,got=[false,false,false];const p={x:240,y:160,fx:0,fy:1},npcs=[{x:240,y:128,n:'MIRA',coat:'#c56b50',hair:'#76513d',line:'Der Wind hat sieben Echos verloren. Sammle drei Echosamen und bringe sie zum Brunnen. Dann öffnet sich der Weg zum ersten Schrein.'},{x:95,y:180,n:'TOMKE',coat:'#608eaa',hair:'#493c32',line:'Hinter dem Fluss liegt ein alter Pfad zu den vergessenen Hügeln.'},{x:365,y:170,n:'EDA',coat:'#d29a52',hair:'#8a4e3c',line:'Mein Garten blüht nur noch, wenn die Echos zurückkehren.'}],houses=[{x:55,y:45,w:66,h:54,door:[88,96],name:'Miras Haus'},{x:350,y:43,w:75,h:58,door:[385,100],name:'Die Taverne'},{x:195,y:14,w:62,h:48,door:[225,62],name:'Krämerladen'}],enemies=[{x:670,y:390,hp:3},{x:720,y:430,hp:3},{x:790,y:350,hp:4}];function R(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)}function tree(x,y){R(x+9,y+17,7,14,'#765238');R(x,y+4,25,22,'#276642');R(x+3,y,20,19,'#39834a');R(x+7,y+3,7,5,'#79b95b');R(x+18,y+8,5,5,'#8acb67')}function person(x,y,col,hair){R(x+3,y+16,12,3,'#41613c');R(x+4,y+8,10,10,col);R(x+3,y+2,12,9,hair);R(x+5,y+4,8,7,'#edbd8c');R(x+6,y+6,2,2,'#44352e');R(x+11,y+6,2,2,'#44352e');R(x+4,y+17,4,5,'#51453b');R(x+10,y+17,4,5,'#51453b')}function hero(x,y){let h=hs[who];R(x+3,y+19,12,3,'#38533a');R(x+4,y+8,10,12,h[3]);R(x+3,y+9,3,7,'#e2b18a');R(x+13,y+9,3,7,'#e2b18a');R(x+4,y+2,10,8,h[4]);R(x+6,y+5,2,2,'#342d2a');R(x+11,y+5,2,2,'#342d2a');R(x+5,y+19,3,4,'#594333');R(x+11,y+19,3,4,'#594333');if(who===1)R(x+14,y+5,5,13,'#b8b9a4');if(who===2)R(x,y+5,3,14,'#775a39');if(who===3)R(x+6,y-2,6,3,'#e7d2ff');if(who===4)R(x+3,y+8,12,3,'#9fbad0')}function house(h){R(h.x-3,h.y+16,h.w+6,h.h-10,'#876044');R(h.x-7,h.y,h.w+14,28,'#9e4937');R(h.x-3,h.y+3,h.w+6,20,'#d36b4c');for(let x=h.x;x<h.x+h.w;x+=13)R(x,h.y+2,2,20,'#f1a36a');R(h.x+7,h.y+29,15,14,'#6d9ba0');R(h.x+h.w-22,h.y+29,15,14,'#6d9ba0');R(h.x+h.w/2-7,h.y+h.h-19,14,19,'#64432f')}function village(){for(let y=0;y<650;y+=16)for(let x=0;x<900;x+=16){let col=y>245&&y<310?'#d4bf88':x<125&&y>330?'#398eaa':x>135&&x<760&&y>275&&y<335?'#d8c99e':'#69ad59';R(x-cam.x,y-cam.y,16,16,col);if(col==='#69ad59'&&(x*17+y*13)%113<5)R(x-cam.x+5,y-cam.y+6,2,2,'#dce58a')}for(let x=0;x<900;x+=16){tree(x-cam.x,12-cam.y);tree(x-cam.x,580-cam.y)}for(let y=90;y<570;y+=80){tree(8-cam.x,y-cam.y);tree(855-cam.x,y-cam.y)}houses.forEach(h=>house({...h,x:h.x-cam.x,y:h.y-cam.y}));[[155,130],[290,80],[510,115],[590,420],[780,220]].forEach(q=>tree(q[0]-cam.x,q[1]-cam.y));R(190-cam.x,225-cam.y,40,25,'#8a7652');R(194-cam.x,221-cam.y,32,10,'#c5a16a');R(208-cam.x,211-cam.y,5,10,'#9ac6d0');npcs.forEach(n=>person(n.x-cam.x,n.y-cam.y,n.coat,n.hair));[[310,185],[550,245],[760,500]].forEach((q,i)=>{if(!got[i]){R(q[0]-cam.x+6,q[1]-cam.y,4,12,'#f2d45c');R(q[0]-cam.x+2,q[1]-cam.y+4,12,4,'#fff0a8')}});enemies.forEach(e=>{if(e.hp>0){R(e.x-cam.x+3,e.y-cam.y+7,20,13,'#39864d');R(e.x-cam.x+6,e.y-cam.y+3,14,10,'#77c76a');R(e.x-cam.x+8,e.y-cam.y+7,3,3,'#fff2c9');R(e.x-cam.x+16,e.y-cam.y+7,3,3,'#fff2c9')}})}function interior(){R(0,0,W,H,'#946d4b');for(let y=0;y<H;y+=16)for(let x=0;x<W;x+=16)R(x,y,16,16,(x/16+y/16)%2?'#bd9466':'#b4875d');R(25,20,430,210,'#e3c99a');for(let x=32;x<450;x+=32)R(x,22,2,206,'#9a704d');R(180,26,120,25,'#8b4938');R(185,31,110,15,'#c96a4a');R(190,90,100,48,'#79533a');R(200,98,80,32,'#d6b17a');R(205,150,70,55,'#8a5a38');R(220,165,40,40,'#c08b52');person(95,100,'#5c8c9b','#614635')}function render(){g.clearRect(0,0,W,H);if(scene==='village'){village();hero(p.x-cam.x,p.y-cam.y)}else{interior();person(p.x,p.y,hs[who][3],hs[who][4])}}function say(n,t){dialog=true;document.querySelector('#speaker').textContent=n;document.querySelector('#speech').textContent=t;document.querySelector('#dialog').style.display='block'}function closeDialog(){dialog=false;document.querySelector('#dialog').style.display='none'}function interact(){if(dialog){closeDialog();return}if(scene==='inside'){scene='village';p.x=88;p.y=108;return}let h=houses.find(h=>Math.hypot(h.door[0]-p.x,h.door[1]-p.y)<30);if(h){scene='inside';p.x=230;p.y=180;say(h.name,'Du bist im Haus! Hier kannst du dich umsehen. Mit Aktion an der Tür gehst du wieder hinaus.');return}let n=npcs.find(n=>Math.hypot(n.x-p.x,n.y-p.y)<28);if(n){if(n.n==='MIRA'&&quest===0){quest=1;say('MIRA','Die sieben Echos sind verstummt. Finde drei Echosamen in Windruh und bringe sie zum Brunnen.')}else say(n.n,n.line);return}let qs=[[310,185],[550,245],[760,500]],i=qs.findIndex((q,i)=>!got[i]&&Math.hypot(q[0]-p.x,q[1]-p.y)<28);if(i>=0){got[i]=true;seeds++;coins+=5;if(seeds===3)quest=2;say('ECHOSAMEN','Ein Lichtfunke steigt auf. Du hast '+seeds+' von 3 Echosamen.');return}if(quest===2&&Math.hypot(210-p.x,220-p.y)<38){quest=3;say('DER BRUNNEN','Die Samen erwachen. Ein uralter Pfad zum Flüsterwald öffnet sich!');return}say('AVARRA','Der Wind flüstert von sieben Echos und einem Weg weit über dieses Tal hinaus.')}function attack(){let e=enemies.find(e=>e.hp>0&&Math.hypot(e.x-p.x,e.y-p.y)<38);if(e){e.hp--;if(!e.hp)coins+=8}}function skill(){if(skillCd>0)return;skillCd=3;let h=hs[who];if(who===0||who===4){p.x+=p.fx*65;p.y+=p.fy*65}else if(who===1)hp=Math.min(5,hp+1);else if(who===2){let e=enemies.find(e=>e.hp>0);if(e)e.hp-=2}else{enemies.forEach(e=>{if(Math.hypot(e.x-p.x,e.y-p.y)<75)e.hp-=2});hp=Math.min(5,hp+1)}}function move(dt){let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+stick.x,y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+stick.y,m=Math.hypot(x,y);if(m>1){x/=m;y/=m}if(m>.08){p.fx=Math.sign(x);p.fy=Math.sign(y);p.x+=x*hs[who][2]*dt;p.y+=y*hs[who][2]*dt}if(scene==='village'){p.x=Math.max(12,Math.min(888,p.x));p.y=Math.max(15,Math.min(625,p.y));cam.x=Math.max(0,Math.min(420,p.x-W/2));cam.y=Math.max(0,Math.min(380,p.y-H/2))}else{p.x=Math.max(20,Math.min(450,p.x));p.y=Math.max(30,Math.min(235,p.y))}}function loop(t){if(!started)return;let dt=Math.min(.04,(t-last)/1000||0);last=t;if(!dialog&&!paused){move(dt);skillCd=Math.max(0,skillCd-dt)}render();document.querySelector('#hearts').textContent='♥ '.repeat(hp)+'♡ '.repeat(5-hp);document.querySelector('#seeds').textContent=seeds;document.querySelector('#coins').textContent=coins;document.querySelector('#heroName').textContent=hs[who][0]+' · '+hs[who][1];document.querySelector('#quest').textContent=scene==='inside'?'Windruh · Innenraum':quest===0?'Windruh · Sprich mit Mira':quest===1?'Quest: Echosamen '+seeds+'/3':quest===2?'Kehre zum Brunnen zurück':'Das erste Echo ist erwacht';requestAnimationFrame(loop)}function panel(k){paused=true;let title='Questbuch',text=quest===0?'Finde Mira am Dorfbrunnen.':quest===1?'Sammle drei Echosamen in Windruh.':quest===2?'Bringe die Samen zum Brunnen.':'Der Weg zum Flüsterwald ist offen.';if(k==='bag'){title='Rucksack';text='Windtaler: '+coins+' · Echosamen: '+seeds+'/3.'}if(k==='map'){title='Weltkarte';text='Avarra: Windruh, Flüsterwald und Vergessene Ruinen. Weitere Regionen öffnen sich mit der Story.'}if(k==='save'){localStorage.setItem('talwind-save',JSON.stringify({who,p,quest,seeds,coins,hp,got}));title='Gespeichert';text='Dein Abenteuer wurde in diesem Browser gespeichert.'}document.querySelector('#modalTitle').textContent=title;document.querySelector('#modalText').textContent=text;document.querySelector('#modal').classList.remove('hide')}function closePanel(){paused=false;document.querySelector('#modal').classList.add('hide')}document.querySelector('#close').onclick=closePanel;document.querySelector('#next').onclick=closeDialog;document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>panel(b.dataset.panel));document.querySelector('#use').onclick=interact;document.querySelector('#attack').onclick=attack;document.querySelector('#skill').onclick=skill;document.querySelector('#roll').onclick=()=>{p.x+=p.fx*45;p.y+=p.fy*45};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['e',' ','j','k','shift'].includes(e.key.toLowerCase()))e.preventDefault();if(!e.repeat){if(e.key.toLowerCase()==='e'||e.key===' ')interact();if(e.key.toLowerCase()==='j')attack();if(e.key.toLowerCase()==='k')skill();if(e.key==='Shift')document.querySelector('#roll').click()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);let st=document.querySelector('#stick'),nub=document.querySelector('#nub');function stickMove(e){let r=st.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,d=Math.hypot(dx,dy),m=Math.min(30,d);stick.x=d>5?dx/d*m/30:0;stick.y=d>5?dy/d*m/30:0;nub.style.transform='translate('+stick.x*30+'px,'+stick.y*30+'px)'}st.onpointerdown=e=>{st.setPointerCapture(e.pointerId);stickMove(e)};st.onpointermove=e=>{if(e.buttons)stickMove(e)};['pointerup','pointercancel'].forEach(ev=>st.addEventListener(ev,()=>{stick.x=stick.y=0;nub.style.transform=''}));let grid=document.querySelector('#heroes');hs.forEach((h,i)=>{let b=document.createElement('button');b.className='hero'+(!i?' sel':'');b.innerHTML='<canvas width="42" height="55"></canvas><b>'+h[0]+'</b><small>'+h[1]+'<br>'+h[5]+'</small>';let q=b.querySelector('canvas').getContext('2d');q.fillStyle=h[3];q.fillRect(12,17,18,25);q.fillStyle=h[4];q.fillRect(12,5,18,14);q.fillStyle='#edbd8c';q.fillRect(16,11,11,9);b.onclick=()=>{who=i;document.querySelectorAll('.hero').forEach((x,j)=>x.classList.toggle('sel',j===i))};grid.appendChild(b)});document.querySelector('#start').onclick=()=>{document.querySelector('#title').classList.add('hide');started=true;last=performance.now();say('MIRA','Willkommen in Windruh, '+hs[who][0]+'. Hilf uns, die sieben Echos zurückzubringen.');requestAnimationFrame(loop)};try{let d=JSON.parse(localStorage.getItem('talwind-save')||'null');if(d){who=d.who||0;Object.assign(p,d.p||{});quest=d.quest||0;seeds=d.seeds||0;coins=d.coins||25;hp=d.hp||5;d.got?.forEach((v,i)=>got[i]=v)}}catch(e){}render()})();</script></body></html>
