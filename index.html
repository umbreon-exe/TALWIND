<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f4c66d"><title>TALWIND – Die sieben Echos</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#233c39;font-family:ui-monospace,monospace;color:#49352f}body{display:grid;place-items:center;touch-action:none}#frame{position:relative;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);overflow:hidden;background:#75bd68;box-shadow:0 0 0 5px #563e35,0 0 0 9px #e9b95f}canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}.panel{background:#fff0c9;border:3px solid #684738;box-shadow:inset 0 0 0 2px #e5ad55,3px 4px #49352f;padding:7px 10px;font-size:clamp(9px,1.2vw,14px);line-height:1.5}#hud{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px;pointer-events:none}#hearts{font-size:18px;color:#c64c43}#quest{text-align:right;max-width:42%}#dialog{display:none;position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:min(82%,540px);text-align:center}#dialog b{color:#a84d3d}#dialog p{margin:3px 0 0;font-size:clamp(10px,1.15vw,14px)}#start{position:absolute;inset:0;display:grid;place-items:center;background:#244b45bb;color:#49352f;text-align:center}#start>div{width:min(90%,440px);padding:22px;background:#f8dfa1;border:5px solid #684738;box-shadow:inset 0 0 0 3px #d58c48,7px 8px #172f2c}.logo{font-size:clamp(34px,7vw,58px);font-weight:1000;letter-spacing:5px;color:#b94e3f;text-shadow:3px 3px #f3c96e,5px 6px #674333;margin:0}button{font:inherit;font-weight:900;color:#fff1c9;background:#b94e3f;border:3px solid #684738;padding:10px 16px;box-shadow:3px 4px #684738}#touch{display:none;position:absolute;inset:auto 10px 10px;justify-content:space-between;align-items:end;pointer-events:none}.pad{width:100px;height:84px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:3px;pointer-events:auto}.pad button,.actions button{padding:0;background:#f4d58d;color:#604332;border-color:#704a36;box-shadow:2px 3px #49352f;opacity:.9}.pad button:nth-child(1){grid-area:1/2}.pad button:nth-child(2){grid-area:2/1}.pad button:nth-child(3){grid-area:2/2}.pad button:nth-child(4){grid-area:2/3}.pad button:nth-child(5){grid-area:3/2}.actions{display:flex;gap:7px;pointer-events:auto}.actions button{width:45px;height:45px;border-radius:50%;font-size:11px}@media(pointer:coarse){#touch{display:flex}}@media(max-width:560px){#hud{padding:6px}.panel{padding:4px 6px}.pad{width:88px;height:72px}.actions button{width:38px;height:38px}}
</style></head><body><div id="frame"><canvas id="game" width="480" height="270"></canvas>
<div id="hud"><div class="panel"><div id="hearts">♥ ♥ ♥ ♥ ♥</div>✦ <span id="count">0</span>/3 Echosamen</div><div class="panel" id="quest">DORF WINDRUH<br>Sprich mit Mira am Brunnen</div></div>
<div id="dialog" class="panel"><b id="who">MIRA</b><p id="words"></p></div>
<div id="start"><div><p class="logo">TALWIND</p><b style="color:#75503b">DIE SIEBEN ECHOS</b><p>Ein farbenfrohes Pixel-Abenteuer in Avarra</p><p style="font-size:12px;line-height:1.7">WASD / Pfeiltasten · Leertaste: Aktion · J: Schwert<br>Controller: Stick + A/B · Touch-Steuerkreuz</p><button id="begin">ABENTEUER STARTEN</button></div></div>
<div id="touch"><div class="pad"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="none">●</button><button data-dir="right">▶</button><button data-dir="down">▼</button></div><div class="actions"><button data-act="talk">A<br>AKTION</button><button data-act="hit">B<br>SCHWERT</button></div></div></div>
<script>
(()=>{'use strict';const c=document.querySelector('canvas'),g=c.getContext('2d');g.imageSmoothingEnabled=false;const W=480,H=270,T=16,WW=64,WH=48;
const P={edge:'#604332',grass:'#75bd68',grass2:'#a8d879',deep:'#38634c',water:'#4b9fbd',foam:'#c4e9d7',path:'#bd8958',stone:'#858879',wood:'#80533b',gold:'#f5c85f',cream:'#f6dfa0'};
const keys={},touch={x:0,y:0},cam={x:0,y:0};let live=false,last=0,dialog=false,petals=0,hp=5,unlocked=false;
const hero=['....oooo....','...oddddo...','..odyyyydo..','..odssssd...','...osssso....','..osssssso...','..obbbbbb...','..obbbbbb...','...obbbbo....','....oddo.....','...od..do....','...o....o....'];
const slime=['...gggg...','..gllllg..','.gllllllg.','gllggggllg','gllllllllg','.gllllllg.','..gggggg..','...oooo...'];
const HPal={o:P.edge,d:'#345b4d',g:'#76b96b,l:'#b5db7b,s:'#efbd83',b:'#426f9a',y:'#f1c85d'};
function R(x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),w,h)}
function sprite(rows,x,y,p){rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(p[ch])R(x+i,y+j,1,1,p[ch])}))}
function ground(tx,ty){let x=tx*T,y=ty*T,rx=39+Math.sin(ty*.23)*2;if(Math.abs(tx-rx)<2.5){R(x,y,16,16,P.water);R(x+2,y+3,5,1,P.foam);R(x+9,y+10,4,1,'#76c4cb');if((tx+ty)%3===0)R(x+7,y+6,2,1,'#d0eee0');return}
let road=(ty>=21&&ty<=23&&tx>=7&&tx<=43)||(tx>=21&&tx<=23&&ty>=10&&ty<=34);R(x,y,16,16,road?P.path:P.grass);if(road){R(x+2,y+4,3,1,'#d9a36a');R(x+10,y+11,2,2,'#a66f49')}else if((tx*3+ty*5)%7===0){R(x+3,y+5,2,2,P.grass2);R(x+11,y+12,1,2,P.deep)}}
function tree(x,y){R(x+5,y+16,7,10,P.wood);R(x+1,y+8,14,10,'#386b48');R(x+3,y+2,11,12,'#397d54');R(x+5,y+1,6,5,'#55a65c');R(x+3,y+8,3,3,'#83c86b');R(x+11,y+6,3,3,'#2e6245')}
function flower(x,y,col){R(x+7,y+7,2,6,'#477b49');R(x+5,y+5,2,2,col);R(x+9,y+5,2,2,col);R(x+7,y+3,2,2,'#fff0bd');R(x+7,y+7,2,2,P.gold)}
function house(x,y,roof){R(x+2,y+13,42,27,'#e9c98b');R(x,y+12,46,4,P.edge);R(x+5,y+17,36,22,'#f3dfa9');R(x+5,y+20,9,9,'#6ba7b2');R(x+6,y+21,7,7,'#b5e4d1');R(x+31,y+20,8,9,'#6ba7b2');R(x+32,y+21,6,7,'#b5e4d1');R(x+19,y+25,10,15,P.wood);R(x+26,y+32,2,2,P.gold);R(x-3,y+9,52,8,P.edge);R(x+1,y+4,44,9,roof);R(x+6,y,34,8,roof);R(x+11,y-3,24,5,roof);R(x+9,y+2,5,3,'#f6b16b');R(x+32,y+6,5,3,'#f6b16b')}
const homes=[[5,8,'#c85a48'],[13,6,'#d58c43'],[27,7,'#b84f45'],[5,29,'#c87548'],[14,31,'#4d8791'],[27,29,'#d08a42'],[33,15,'#b9554a'],[2,18,'#4c8291'],[17,15,'#d06a4e'],[27,20,'#b85b48']];
const people=[{x:23*T,y:18*T,n:'MIRA',c:'#e0a15e',t:'Die sieben Echos sind verstummt. Sammle drei Echosamen in den Gärten und bringe den Wind zurück!',id:0},{x:10*T,y:22*T,n:'BRUNO',c:'#6997b1',t:'Hinter dem Fluss liegt eine alte Ruine. Die Brücke führt dich hinüber.'},{x:31*T,y:24*T,n:'LIO',c:'#a77db4',t:'Nachts leuchten Glühwürmchen wie kleine Sterne.'},{x:8*T,y:14*T,n:'EDA',c:'#c86b52',t:'Frische Beeren! Pass auf die grünen Schleime am Waldrand auf.'}];
const seeds=[{x:8*T,y:10*T},{x:29*T,y:11*T},{x:32*T,y:33*T}],mobs=[{x:52*T,y:23*T,h:2},{x:57*T,y:29*T,h:2},{x:47*T,y:34*T,h:2},{x:55*T,y:39*T,h:3}];
const p={x:22*T,y:25*T,vx:0,vy:0,dir:'down',anim:0,hit:0,inv:0};
function message(n,t){dialog=true;document.querySelector('#who').textContent=n;document.querySelector('#words').textContent=t;document.querySelector('#dialog').style.display='block'}
function closeMessage(){dialog=false;document.querySelector('#dialog').style.display='none'}
function action(){if(dialog){closeMessage();return}let q=people.find(n=>Math.hypot(n.x-p.x,n.y-p.y)<35);if(q){if(q.id===0&&petals===3){unlocked=true;document.querySelector('#quest').innerHTML='DIE ALTE RUINE<br>Das Tor im Osten ist offen!';message(q.n,'Du hast alle Echosamen gefunden! Die Ruine erwacht. Geh nach Osten über die Brücke!')}else message(q.n,'„'+q.t+'“');return}
let s=seeds.find(v=>!v.got&&Math.hypot(v.x-p.x,v.y-p.y)<30);if(s){s.got=true;petals++;document.querySelector('#count').textContent=petals;if(petals===3){document.querySelector('#quest').innerHTML='DIE ALTE RUINE<br>Sprich noch einmal mit Mira!';message('ECHO','Drei Echosamen gesammelt! Kehre zu Mira am Brunnen zurück.')}else message('ECHO','Ein leuchtender Echosamen!');return}
if(Math.hypot(p.x-55*T,p.y-14*T)<70)message(unlocked?'DIE RUINE':'VERSCHLOSSEN',unlocked?'Das alte Tor öffnet sich. Ein warmer Wind trägt die Melodie zurück nach Avarra!':'Finde drei Echosamen und sprich mit Mira.')}
function attack(){if(p.hit>0)return;p.hit=.2;for(const m of mobs)if(m.h>0&&Math.hypot(m.x-p.x,m.y-p.y)<34)m.h--}
function input(){let x=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+touch.x,y=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+touch.y;let gp=navigator.getGamepads?.()[0];if(gp){let ax=gp.axes[0]||0,ay=gp.axes[1]||0;if(Math.hypot(ax,ay)>.15){x=ax;y=ay}if(gp.buttons[0]?.pressed&&!input.a){action();input.a=1}if(!gp.buttons[0]?.pressed)input.a=0;if(gp.buttons[1]?.pressed&&!input.b){attack();input.b=1}if(!gp.buttons[1]?.pressed)input.b=0}let d=Math.hypot(x,y);if(d>1){x/=d;y/=d}return{x,y}}
function blocked(x,y){if(x<8||y<8||x>WW*T-20||y>WH*T-24)return true;let tx=Math.floor(x/T),ty=Math.floor(y/T),rx=39+Math.sin(ty*.23)*2;if(tx>=37&&tx<=41&&Math.abs(tx-rx)<2)return true;for(const [hx,hy] of homes)if(x>hx*T-3&&x<(hx+3)*T+4&&y>hy*T+8&&y<(hy+2)*T+5)return true;if(x>49*T&&x<60*T&&y>8*T&&y<18*T&&!unlocked)return true;return false}
function update(dt){let a=input(),speed=94;p.vx=a.x*speed;p.vy=a.y*speed;if(a.x||a.y){p.anim+=dt*9;p.dir=Math.abs(a.x)>Math.abs(a.y)?(a.x>0?'right':'left'):(a.y>0?'down':'up')}let nx=p.x+p.vx*dt,ny=p.y+p.vy*dt;if(!blocked(nx+5,p.y+18)&&!blocked(nx+11,p.y+22))p.x=nx;if(!blocked(p.x+5,ny+18)&&!blocked(p.x+11,ny+22))p.y=ny;p.hit=Math.max(0,p.hit-dt);p.inv=Math.max(0,p.inv-dt);for(const m of mobs)if(m.h>0){let dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy);if(d<95&&d>2){m.x+=dx/d*24*dt;m.y+=dy/d*24*dt}if(d<17&&p.inv<=0){hp=Math.max(0,hp-1);p.inv=1.1;document.querySelector('#hearts').textContent='♥ '.repeat(hp)+'♡ '.repeat(5-hp)}}cam.x=Math.max(0,Math.min(WW*T-W,p.x-W/2));cam.y=Math.max(0,Math.min(WH*T-H,p.y-H/2))}
function actor(npc){R(npc.x+3,npc.y+20,12,3,'#36513c');R(npc.x+4,npc.y+4,9,8,npc.c);R(npc.x+5,npc.y+1,8,6,P.edge);R(npc.x+6,npc.y+3,2,2,'#fff0bd');R(npc.x+10,npc.y+3,2,2,'#fff0bd');R(npc.x+4,npc.y+12,10,10,npc.c);R(npc.x+5,npc.y+22,3,4,P.edge);R(npc.x+11,npc.y+22,3,4,P.edge)}
function render(){R(0,0,W,H,P.grass);g.save();g.translate(-Math.floor(cam.x),-Math.floor(cam.y));let sx=Math.floor(cam.x/T),sy=Math.floor(cam.y/T);for(let y=sy;y<sy+20;y++)for(let x=sx;x<sx+33;x++)ground(x,y);
for(const h of homes)house(h[0]*T,h[1]*T,h[2]);for(let y=17;y<21;y++){R(38*T,y*T,16,16,'#9a6844');R(38*T,y*T,16,2,'#e3b36d');R(38*T,y*T+14,16,2,'#674531')}
R(20*T,19*T,5*T,4*T,'#c18a56');R(21*T,19*T,3*T,3*T,'#7aaeb0');R(21*T,20*T,3*T,2*T,P.water);
for(let i=0;i<90;i++){let x=(i*37+11)%WW,y=(i*23+5)%WH;if(x>3&&x<37&&y>5&&y<39&&((x*7+y*3)%5===0))tree(x*T,y*T)}
for(let i=0;i<160;i++){let x=(i*17+3)%WW,y=(i*29+7)%WH;if(x<37&&y<44&&((x*3+y)%4===0))flower(x*T,y*T,['#f6e28c','#e98979','#b58ad0','#fff0bd'][i%4])}
for(let x=49;x<60;x++){R(x*T,8*T,16,8,'#777d75');R(x*T,8*T,16,2,'#b5aa8d');R(x*T,17*T,16,8,'#777d75')}for(let y=8;y<18;y++){R(49*T,y*T,7,16,'#858a7e');R(59*T,y*T,7,16,'#858a7e')}R(53*T,14*T,4*T,3*T,unlocked?'#8cbd8b':'#554a43');
let actors=[...people.map(n=>({y:n.y,fn:()=>actor(n)})),...mobs.filter(m=>m.h>0).map(m=>({y:m.y,fn:()=>{R(m.x+3,m.y+8,11,3,'#36513c');sprite(slime,m.x,m.y,{g:'#4c985b',l:'#a7dc78',o:'#45623e'})}})),{y:p.y,fn:()=>{R(p.x+3,p.y+20,11,3,'#36513c');sprite(hero,p.x,p.y-4,HPal);if(p.hit>0)R(p.x+(p.dir==='left'?-8:p.dir==='right'?16:4),p.y+9,8,8,'#fff0a0')}}].sort((a,b)=>a.y-b.y);actors.forEach(a=>a.fn());
seeds.forEach(s=>{if(!s.got){R(s.x+7,s.y+5,3,7,'#f4cf57');R(s.x+4,s.y+3,3,3,'#fff1a5');R(s.x+10,s.y+1,3,3,'#fff1a5')}});g.restore()}
function loop(t){if(!live)return;let dt=Math.min(.04,(t-last)/1000||0);last=t;if(!dialog)update(dt);render();requestAnimationFrame(loop)}
document.querySelector('#begin').onclick=()=>{document.querySelector('#start').style.display='none';live=true;last=performance.now();requestAnimationFrame(loop)};
addEventListener('keydown',e=>{keys[e.key]=1;if([' ','Enter'].includes(e.key)){e.preventDefault();if(!e.repeat)action()}if(e.key==='j'&&!e.repeat)attack()});addEventListener('keyup',e=>keys[e.key]=0);
document.querySelectorAll('[data-dir]').forEach(b=>{let set=v=>{touch.x=v==='left'?-1:v==='right'?1:0;touch.y=v==='up'?-1:v==='down'?1:0};b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);set(b.dataset.dir)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>set('none')))});
document.querySelector('[data-act="talk"]').onclick=action;document.querySelector('[data-act="hit"]').onclick=attack;render();
})();</script></body></html>
