name: Extract TALWIND art packs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: ZIP-Dateien entpacken
        run: |
          mkdir -p assets/imported/super-retro-world
          mkdir -p assets/imported/fan-tasy-tileset

          unzip -o "SuperRetroWorld_CharacterPack_Full.zip" -d assets/imported/super-retro-world
          unzip -o "The Fan-tasy Tileset (Free) 1.5.9.zip" -d assets/imported/fan-tasy-tileset

      - name: Entpackte Dateien speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/imported/
          if git diff --cached --quiet; then
            echo "Keine neuen oder geänderten Dateien zum Speichern."
          else
            git commit -m "Extract TALWIND art packs"
            git push
          fi
